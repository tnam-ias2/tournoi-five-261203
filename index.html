<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournoi de five · 9 équipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --fg: #e6ebe8; --mut: #8c9c94; --head: #b9c9c0; --line: #22302a; --soft: #131c18; --field: #0f1713; --bg: #0b100e; --green: #013220; --lime: #6DFF29; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--green); color: #fff; border-bottom: 1px solid #0f4a33; }
  header .in { max-width: 720px; margin: 0 auto; padding: 22px 20px 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  header .logo { height: 22px; width: auto; flex: none; margin-top: 2px; opacity: .92; }
  main { max-width: 720px; margin: 0 auto; padding: 8px 20px 64px; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; }
  h1::before { content: ""; width: 14px; height: 14px; background: var(--lime); flex: none; }
  header .sub { color: rgba(255,255,255,.72); }
  header .sub a { color: var(--lime); }
  h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--head); font-weight: 700; margin: 36px 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 7px; height: 7px; background: var(--lime); flex: none; }
  .sub { color: var(--mut); font-size: .88rem; margin: 4px 0 0; }
  .sub a { color: inherit; }
  label { display: block; font-size: .75rem; color: var(--mut); margin-bottom: 3px; }
  input, select { font: inherit; color: var(--fg); background: var(--field); border: 1px solid #2a3b33; border-radius: 4px; padding: 5px 8px; width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--lime); box-shadow: 0 0 0 2px rgba(109,255,41,.22); }
  button { font: inherit; font-size: .85rem; color: var(--fg); background: transparent; border: 1px solid #36513f; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
  button:hover { background: var(--lime); border-color: var(--lime); color: #000; }
  .cols { display: grid; grid-template-columns: repeat(var(--gc, 3), 1fr); gap: 16px; }
  .cols .g { display: grid; gap: 6px; align-content: start; }
  .cols .g b { font-size: .8rem; font-weight: 600; }
  .opts { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-top: 18px; }
  .opts > div { width: 96px; }
  .opts .btns { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .opts > div.btns { width: auto; }
  .round { border-top: 1px solid var(--line); padding: 10px 0 14px; }
  .rh span:first-child { font-weight: 600; color: var(--fg); }
  .rh { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 6px; }
  .rh .t { color: var(--mut); font-variant-numeric: tabular-nums; }
  .m { display: grid; grid-template-columns: 62px 1fr auto 1fr; gap: 10px; align-items: center; padding: 5px 0; }
  .m .p { font-size: .75rem; color: var(--mut); line-height: 1.2; }
  .m .a { text-align: right; }
  .m .pend { color: var(--mut); }
  .m .w { font-weight: 600; }
  .m .w .n { color: var(--lime); box-shadow: inset 0 -2px 0 rgba(109,255,41,.55); }
  .sc { display: flex; align-items: center; gap: 5px; color: var(--mut); }
  .sc input { width: 46px; text-align: center; padding: 5px 2px; }
  .pen { font-size: .8rem; color: var(--mut); padding: 0 0 4px 72px; display: flex; gap: 8px; align-items: center; }
  .pen select { width: auto; padding: 2px 6px; font-size: .8rem; }
  .rest { font-size: .78rem; color: var(--mut); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { padding: 5px 6px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { font-size: .7rem; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }
  th.n, td.n { text-align: left; }
  tr.q td { background: rgba(109,255,41,.12); }
  th { background: var(--soft); }
  .tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
  .tables h3 { font-size: .85rem; margin: 0 0 4px; font-weight: 600; color: var(--fg); }
  ol.rank { list-style: none; margin: 0; padding: 0; }
  ol.rank li { display: flex; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  ol.rank .pos { width: 28px; color: var(--lime); font-weight: 700; font-variant-numeric: tabular-nums; }
  .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; margin-bottom: 14px; }
  .pd { border: 1px solid var(--line); border-top: 4px solid var(--c); padding: 12px 8px 14px; text-align: center; background: var(--soft); }
  .pd.gold { --c: #D4AF37; min-height: 128px; background: linear-gradient(#2b2610, var(--soft)); }
  .pd.silver { --c: #A7A9AC; min-height: 104px; }
  .pd.bronze { --c: #B87333; min-height: 92px; }
  .pd .medal { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: #fff; font-weight: 700; font-size: .85rem; }
  .pd .lab { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--mut); margin: 6px 0 2px; }
  .pd .nm { font-weight: 600; font-size: 1.02rem; word-break: break-word; }
  .note { color: var(--mut); font-size: .8rem; margin-top: 10px; }
  @media (max-width: 560px) {
    .cols { grid-template-columns: 1fr !important; }
    .m { grid-template-columns: 1fr auto 1fr; }
    .m .p { grid-column: 1 / -1; }
    .pen { padding-left: 0; }
  }
</style>
</head>

<main>

  <h2>Équipes</h2>
  <div class="cols" id="teams"></div>
  <div class="opts">
    <div><label for="count">Équipes</label><select id="count"></select></div>
    <div><label for="start">Début</label><input type="time" id="start"></div>
    <div><label for="duration">Match (min)</label><input type="number" id="duration" min="1" max="120"></div>
    <div><label for="transition">Transition (min)</label><input type="number" id="transition" min="0" max="30"></div>
    <div><label for="pitches">Terrains</label><input type="number" id="pitches" min="1" max="12"></div>
    <div class="btns">
      <button type="button" id="btnCopy">Copier le lien</button>
      <button type="button" id="btnShuffle">Mélanger</button>
      <button type="button" id="btnReset">Effacer les scores</button>
    </div>
  </div>

  <h2>Planning</h2>
  <div id="planning"></div>

  <h2>Classements</h2>
  <div class="tables" id="tables"></div>
  <div id="seeds"></div>
  <div id="final"></div>
  <p class="note" id="note"></p>
</main>

<script>
(function () {
  'use strict';

  const KEY = 'tournoi-9-v1';
  const MIN_N = 6, MAX_N = 12;
  const LETTERS = ['A', 'B', 'C'];
  // composition des poules selon le nombre d'équipes
  const SIZES = { 6: [3, 3], 7: [4, 3], 8: [4, 4], 9: [3, 3, 3], 10: [4, 3, 3], 11: [4, 4, 3], 12: [4, 4, 4] };
  // rencontres d'une poule, tour par tour
  const R3 = [[[0, 1]], [[0, 2]], [[1, 2]]];                                  // le 3e est au repos
  const R4 = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
  const REST3 = [2, 1, 0];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- État ---------- */
  function fresh() {
    return {
      n: 9,
      teams: Array.from({ length: MAX_N }, (_, i) => 'Équipe ' + (i + 1)),
      cfg: { start: '14:00', duration: 30, transition: 3, pitches: 4 },
      scores: {}, pen: {}
    };
  }
  function normalize(s) {
    if (!s || !Array.isArray(s.teams) || s.teams.length < MIN_N) return null;
    const f = fresh();
    const n = Math.min(MAX_N, Math.max(MIN_N, parseInt(s.n, 10) || s.teams.length));
    const teams = f.teams.map((d, i) => (typeof s.teams[i] === 'string' ? s.teams[i] : d));
    return Object.assign(f, s, { n: n, teams: teams, cfg: Object.assign(f.cfg, s.cfg) });
  }
  function load() {
    try { return normalize(JSON.parse(localStorage.getItem(KEY))) || fresh(); } catch (e) { return fresh(); }
  }
  /* L'état (équipes, réglages, scores) est aussi porté par l'adresse de la page :
     le lien copié rouvre le même tournoi sur n'importe quel navigateur, sans serveur. */
  function readHash() {
    try {
      const m = location.hash.match(/^#d=(.+)$/);
      return m ? normalize(JSON.parse(decodeURIComponent(m[1]))) : null;
    } catch (e) { return null; }
  }
  let state = readHash() || load();
  let hashTimer = null;
  function writeHash() {
    try { history.replaceState(null, '', '#d=' + encodeURIComponent(JSON.stringify(state))); } catch (e) { /* ignore */ }
  }
  const save = () => {
    localStorage.setItem(KEY, JSON.stringify(state));
    clearTimeout(hashTimer);
    hashTimer = setTimeout(writeHash, 400);
  };

  const name = (i) => (i == null ? null : (state.teams[i] || 'Équipe ' + (i + 1)));
  const toMin = (t) => { const [h, m] = (t || '14:00').split(':').map(Number); return h * 60 + m; };
  const fmt = (min) => { min = ((min % 1440) + 1440) % 1440; return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); };
  const ordinal = (n) => (n === 1 ? '1er' : n + 'e');

  /* ---------- Structure du tournoi ---------- */
  const sizes = () => SIZES[state.n];
  const mode = () => (sizes().length === 2 ? 'cross' : 'sf');
  const groupStart = (g) => sizes().slice(0, g).reduce((a, b) => a + b, 0);

  function groupRound(g, r) {
    const base = groupStart(g);
    return (sizes()[g] === 3 ? R3 : R4)[r].map((p, k) => ({ id: 'G' + g + '-' + r + (k ? '-' + k : ''), a: base + p[0], b: base + p[1] }));
  }
  const groupMatchList = (g) => [0, 1, 2].reduce((acc, r) => acc.concat(groupRound(g, r)), []);

  /* Équipes restant hors des demi-finales/5e place (3es et 4es de poule) en mode « sf » */
  const restCount = () => 3 + sizes().filter((s) => s === 4).length;
  const consCount = () => (restCount() >= 4 ? Math.floor(restCount() / 2) : 0);

  /* ---------- Scores et classements ---------- */
  function getScore(id) {
    const s = state.scores[id];
    if (!s || s.a === '' || s.b === '' || s.a == null || s.b == null) return null;
    return { a: Number(s.a), b: Number(s.b) };
  }

  // à l'intérieur d'une poule, puis entre poules (rapporté au nombre de matchs joués)
  const cmp = (x, y) => y.pts - x.pts || (y.bp - y.bc) - (x.bp - x.bc) || y.bp - x.bp || x.i - y.i;
  const per = (v, j) => (j ? v / j : 0);
  const cmpX = (x, y) => per(y.pts, y.j) - per(x.pts, x.j) || per(y.bp - y.bc, y.j) - per(x.bp - x.bc, x.j) ||
    per(y.bp, y.j) - per(x.bp, x.j) || x.i - y.i;

  function groupTable(g) {
    const rows = {};
    const base = groupStart(g);
    for (let k = 0; k < sizes()[g]; k++) { const i = base + k; rows[i] = { i: i, g: g, j: 0, w: 0, d: 0, l: 0, bp: 0, bc: 0, pts: 0 }; }
    const list = groupMatchList(g);
    let played = 0;
    list.forEach((m) => {
      const sc = getScore(m.id);
      if (!sc) return;
      played++;
      const A = rows[m.a], B = rows[m.b];
      A.j++; B.j++;
      A.bp += sc.a; A.bc += sc.b; B.bp += sc.b; B.bc += sc.a;
      if (sc.a > sc.b) { A.w++; B.l++; A.pts += 3; }
      else if (sc.a < sc.b) { B.w++; A.l++; B.pts += 3; }
      else { A.d++; B.d++; A.pts++; B.pts++; }
    });
    return { rows: Object.values(rows).sort(cmp), complete: played === list.length };
  }

  /* Qualifiés et rencontres de classement, une fois toutes les poules terminées */
  function qualification() {
    const tabs = sizes().map((_, g) => groupTable(g));
    const out = { tabs: tabs, mode: mode(), ready: tabs.every((t) => t.complete) };
    if (!out.ready) return out;

    if (out.mode === 'cross') {
      const k = Math.min.apply(null, sizes());
      out.cross = Array.from({ length: k }, (_, x) => ({ a: tabs[0].rows[x].i, b: tabs[1].rows[x].i }));
      out.left = [];
      tabs.forEach((t) => t.rows.slice(k).forEach((r) => out.left.push(r)));
      return out;
    }

    const pick = (rank) => tabs.map((t) => t.rows[rank]).filter(Boolean).sort(cmpX);
    const winners = pick(0), runners = pick(1);
    const s = [winners[0], winners[1], winners[2], runners[0]];
    out.seeds = s;
    // demi-finales 1-4 et 2-3, sauf revanche de poule (alors 1-3 et 2-4)
    out.sf = s[3].g === s[0].g ? [[s[0].i, s[2].i], [s[1].i, s[3].i]] : [[s[0].i, s[3].i], [s[1].i, s[2].i]];
    out.p5 = [runners[1].i, runners[2].i];
    const rest = pick(2).concat(pick(3));           // les 3es, puis les 4es
    out.cons = [];
    if (rest.length >= 4) {
      for (let j = 0; j + 1 < rest.length; j += 2) out.cons.push([rest[j].i, rest[j + 1].i]);
      out.left = rest.length % 2 ? [rest[rest.length - 1]] : [];
    } else {
      out.left = rest;
    }
    return out;
  }

  function outcome(id, a, b) {
    if (a == null || b == null) return null;
    const sc = getScore(id);
    if (!sc) return null;
    if (sc.a > sc.b) return { w: a, l: b };
    if (sc.b > sc.a) return { w: b, l: a };
    const p = state.pen[id];
    if (p === 'a') return { w: a, l: b };
    if (p === 'b') return { w: b, l: a };
    return null;
  }

  /* ---------- Planning ---------- */
  function buildPlan() {
    const q = qualification();
    const G = sizes().length;
    const rounds = [];

    for (let r = 0; r < 3; r++) {
      const ms = [], rest = [];
      for (let g = 0; g < G; g++) {
        groupRound(g, r).forEach((m) => ms.push({ id: m.id, a: m.a, b: m.b, meta: 'Poule ' + LETTERS[g], la: name(m.a), lb: name(m.b) }));
        if (sizes()[g] === 3) rest.push(name(groupStart(g) + REST3[r]));
      }
      rounds.push({ label: 'Tour ' + (r + 1) + ' · Poules', matches: ms, rest: rest.join(' · ') });
    }

    const ko = {};                       // id -> match
    const mk = (id, meta, a, b, pa, pb) => { ko[id] = { id: id, meta: meta, a: a == null ? null : a, b: b == null ? null : b, pa: pa, pb: pb, ko: true }; return ko[id]; };
    const at = (arr, k) => (q.ready && arr ? arr[k] : null);
    let placeIds;

    if (q.mode === 'cross') {
      const k = Math.min.apply(null, sizes());
      const ids = ['F', 'P3', 'P5', 'P7'], metas = ['Finale', 'Petite finale', '5e place', '7e place'];
      const ms = [];
      for (let x = 0; x < k; x++) {
        ms.push(mk(ids[x], metas[x], q.ready ? q.cross[x].a : null, q.ready ? q.cross[x].b : null, ordinal(x + 1) + ' poule A', ordinal(x + 1) + ' poule B'));
      }
      rounds.push({ label: 'Tour 4 · Finales', matches: ms });
      placeIds = ids.slice(0, k);
    } else {
      const sf1 = mk('SF1', 'Demi-finale 1', at(q.sf, 0) && q.sf[0][0], at(q.sf, 0) && q.sf[0][1], 'Tête de série 1', 'Tête de série 4');
      const sf2 = mk('SF2', 'Demi-finale 2', at(q.sf, 1) && q.sf[1][0], at(q.sf, 1) && q.sf[1][1], 'Tête de série 2', 'Tête de série 3');
      const p5 = mk('P5', '5e place', q.ready ? q.p5[0] : null, q.ready ? q.p5[1] : null, '2e de poule', '2e de poule');
      const o1 = outcome('SF1', sf1.a, sf1.b), o2 = outcome('SF2', sf2.a, sf2.b);
      const fin = mk('F', 'Finale', o1 && o2 ? o1.w : null, o1 && o2 ? o2.w : null, 'Vainqueur DF1', 'Vainqueur DF2');
      const p3 = mk('P3', 'Petite finale', o1 && o2 ? o1.l : null, o1 && o2 ? o2.l : null, 'Perdant DF1', 'Perdant DF2');
      const consIds = ['P7', 'P9', 'P11'], consMeta = ['7e place', '9e place', '11e place'];
      const cons = [];
      for (let j = 0; j < consCount(); j++) {
        cons.push(mk(consIds[j], consMeta[j], q.ready ? q.cons[j][0] : null, q.ready ? q.cons[j][1] : null, 'À déterminer', 'À déterminer'));
      }
      rounds.push({ label: 'Tour 4 · Demi-finales', matches: [sf1, sf2, p5].concat(cons.slice(0, 1)) });
      rounds.push({ label: 'Tour 5 · Finales', matches: [fin, p3].concat(cons.slice(1)) });
      placeIds = ['F', 'P3', 'P5'].concat(consIds.slice(0, consCount()));
    }

    const outcomes = {};
    Object.keys(ko).forEach((id) => { outcomes[id] = outcome(id, ko[id].a, ko[id].b); });
    return { rounds: rounds, q: q, outcomes: outcomes, placeIds: placeIds };
  }

  function matchHTML(m, pitch) {
    const a = m.ko ? name(m.a) : m.la, b = m.ko ? name(m.b) : m.lb;
    const sc = state.scores[m.id] || { a: '', b: '' };
    const s = getScore(m.id);
    const oc = m.ko ? outcome(m.id, m.a, m.b) : null;
    const winA = s && (m.ko ? (oc && oc.w === m.a) : s.a > s.b);
    const winB = s && (m.ko ? (oc && oc.w === m.b) : s.b > s.a);
    const pend = (v) => (v == null ? ' pend' : '');
    const off = m.ko && (m.a == null || m.b == null) ? ' disabled' : '';
    let html = '<div class="m">' +
      '<div class="p">Terrain ' + pitch + '<br>' + esc(m.meta) + '</div>' +
      '<div class="a' + pend(m.ko ? m.a : 0) + (winA ? ' w' : '') + '"><span class="n">' + esc(a || m.pa) + '</span></div>' +
      '<div class="sc"><input type="number" min="0" inputmode="numeric" data-id="' + m.id + '" data-side="a" value="' + esc(sc.a) + '"' + off + '>–' +
      '<input type="number" min="0" inputmode="numeric" data-id="' + m.id + '" data-side="b" value="' + esc(sc.b) + '"' + off + '></div>' +
      '<div class="b' + pend(m.ko ? m.b : 0) + (winB ? ' w' : '') + '"><span class="n">' + esc(b || m.pb) + '</span></div></div>';
    if (m.ko && s && s.a === s.b && m.a != null && m.b != null) {
      const p = state.pen[m.id] || '';
      html += '<div class="pen">Égalité · vainqueur aux tirs au but :' +
        '<select data-pen="' + m.id + '"><option value="">—</option>' +
        '<option value="a"' + (p === 'a' ? ' selected' : '') + '>' + esc(a) + '</option>' +
        '<option value="b"' + (p === 'b' ? ' selected' : '') + '>' + esc(b) + '</option></select></div>';
    }
    return html;
  }

  /* Découpe chaque tour en créneaux de P matchs maximum (un match par terrain) */
  function slotsOf(plan) {
    const P = state.cfg.pitches, out = [];
    plan.rounds.forEach((rd) => {
      const n = Math.ceil(rd.matches.length / P);
      for (let k = 0; k < n; k++) {
        out.push({
          label: rd.label + (n > 1 ? ' (' + (k + 1) + '/' + n + ')' : ''),
          matches: rd.matches.slice(k * P, (k + 1) * P),
          rest: k === n - 1 ? rd.rest : ''
        });
      }
    });
    return out;
  }

  function renderPlanning(plan) {
    const c = state.cfg;
    let t = toMin(c.start);
    $('#planning').innerHTML = slotsOf(plan).map((sl) => {
      const start = t;
      t += c.duration + c.transition;
      return '<div class="round"><div class="rh"><span>' + esc(sl.label) + '</span><span class="t">' + fmt(start) + ' – ' + fmt(start + c.duration) + '</span></div>' +
        sl.matches.map((m, i) => matchHTML(m, i + 1)).join('') +
        (sl.rest ? '<div class="rest">Au repos : ' + esc(sl.rest) + '</div>' : '') + '</div>';
    }).join('');
  }

  /* ---------- Classements ---------- */
  function tableHTML(g, t) {
    return '<div><h3>Poule ' + LETTERS[g] + (t.complete ? '' : ' <span class="sub">· en cours</span>') + '</h3><table><thead><tr>' +
      '<th class="n">Équipe</th><th>J</th><th>G</th><th>N</th><th>P</th><th>+/−</th><th>Pts</th></tr></thead><tbody>' +
      t.rows.map((r, k) => {
        const d = r.bp - r.bc;
        return '<tr' + (t.complete && k < 2 ? ' class="q"' : '') + '><td class="n">' + esc(name(r.i)) + '</td><td>' + r.j + '</td><td>' + r.w + '</td><td>' + r.d +
          '</td><td>' + r.l + '</td><td>' + (d > 0 ? '+' : '') + d + '</td><td><b>' + r.pts + '</b></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function renderTables(plan) {
    const q = plan.q;
    $('#tables').innerHTML = q.tabs.map((t, g) => tableHTML(g, t)).join('');

    $('#seeds').innerHTML = q.ready && q.mode === 'sf'
      ? '<h2>Qualifiés pour les demi-finales</h2><ol class="rank">' +
        q.seeds.map((r, k) => '<li><span class="pos">' + (k + 1) + '</span><span>' + esc(name(r.i)) +
          ' <span class="sub">· ' + (k < 3 ? '1er' : 'meilleur 2e') + ' poule ' + LETTERS[r.g] + '</span></span></li>').join('') + '</ol>'
      : '';

    // classement final : les places viennent des matchs de classement, puis des équipes restantes
    const pend = '<span class="sub">à jouer</span>';
    const places = [];
    plan.placeIds.forEach((id) => {
      const o = plan.outcomes[id];
      places.push(o ? esc(name(o.w)) : pend);
      places.push(o ? esc(name(o.l)) : pend);
    });
    const nLeft = state.n - places.length;
    for (let k = 0; k < nLeft; k++) places.push(q.ready && q.left[k] ? esc(name(q.left[k].i)) : pend);

    const medal = (cls, label, n, val) =>
      '<div class="pd ' + cls + '"><span class="medal">' + n + '</span><div class="lab">' + label + '</div><div class="nm">' + val + '</div></div>';
    const podium = '<div class="podium">' + medal('silver', 'Argent', 2, places[1]) + medal('gold', 'Or', 1, places[0]) + medal('bronze', 'Bronze', 3, places[2]) + '</div>';
    $('#final').innerHTML = '<h2>Classement final</h2>' + podium + '<ol class="rank">' +
      places.slice(3).map((v, k) => '<li><span class="pos">' + (k + 4) + '</span><span>' + v + '</span></li>').join('') + '</ol>';

    $('#note').textContent = 'Départage : points, différence de buts, buts marqués' + (new Set(sizes()).size > 1 ? ' (comparés par match entre poules de tailles différentes)' : '') + '. ' +
      (q.mode === 'cross'
        ? 'Finale : les 1ers de chaque poule ; petite finale : les 2es ; puis 5e place (3es)' + (sizes()[0] === 4 && sizes()[1] === 4 ? ' et 7e place (4es).' : '.')
        : 'Demi-finales : les 3 premiers de poule + le meilleur 2e. Les deux autres 2es jouent la 5e place' +
          (consCount() ? ', les autres équipes s\u2019affrontent ensuite par rang pour les places suivantes.' : '.'));
  }

  function renderSummary(plan) {
    const c = state.cfg, st = toMin(c.start), z = sizes();
    const slots = slotsOf(plan), n = slots.length;
    const end = st + n * c.duration + (n - 1) * c.transition;
    const par = Math.max.apply(null, plan.rounds.map((r) => r.matches.length));
    const comp = z.every((v) => v === z[0]) ? z.length + ' poules de ' + z[0] : z.length + ' poules (' + z.join(' + ') + ')';
    $('#title').textContent = 'Tournoi de five · ' + state.n + ' équipes';
    document.title = 'Tournoi de five · ' + state.n + ' équipes';
    $('#summary').textContent = comp + ' · ' + n + ' créneaux de ' + c.duration + ' min · ' + c.pitches + ' terrain' + (c.pitches > 1 ? 's' : '') +
      (c.pitches > par ? ' (' + par + ' utilisés)' : '') + ' · ' + fmt(st) + ' → ' + fmt(end);
  }

  function render() {
    const act = document.activeElement;
    const focus = act && act.dataset && act.dataset.id ? { id: act.dataset.id, side: act.dataset.side } : null;
    save();
    const plan = buildPlan();
    renderSummary(plan);
    renderPlanning(plan);
    renderTables(plan);
    if (focus) {
      const el = document.querySelector('input[data-id="' + focus.id + '"][data-side="' + focus.side + '"]');
      if (el && !el.disabled) el.focus();
    }
  }

  /* ---------- Formulaire ---------- */
  function renderTeams() {
    const z = sizes();
    $('#teams').style.setProperty('--gc', z.length);
    $('#teams').innerHTML = z.map((size, g) => {
      const base = groupStart(g);
      return '<div class="g"><b>Poule ' + LETTERS[g] + '</b>' +
        Array.from({ length: size }, (_, k) => '<input type="text" data-team="' + (base + k) + '" value="' + esc(state.teams[base + k]) + '">').join('') + '</div>';
    }).join('');
    $('#count').value = state.n;
    $('#start').value = state.cfg.start;
    $('#duration').value = state.cfg.duration;
    $('#transition').value = state.cfg.transition;
    $('#pitches').value = state.cfg.pitches;
  }

  $('#count').innerHTML = Array.from({ length: MAX_N - MIN_N + 1 }, (_, k) => '<option value="' + (MIN_N + k) + '">' + (MIN_N + k) + '</option>').join('');
  $('#count').addEventListener('change', (e) => {
    const n = parseInt(e.target.value, 10);
    if (n === state.n) return;
    if (Object.keys(state.scores).length && !confirm('Changer le nombre d\u2019équipes efface les scores. Continuer ?')) { e.target.value = state.n; return; }
    state.n = n; state.scores = {}; state.pen = {};
    renderTeams();
    render();
  });
  $('#teams').addEventListener('input', (e) => {
    const i = e.target.dataset.team;
    if (i == null) return;
    state.teams[Number(i)] = e.target.value;
    render();
  });
  $('#start').addEventListener('input', (e) => { state.cfg.start = e.target.value || '14:00'; render(); });
  $('#duration').addEventListener('input', (e) => { state.cfg.duration = Math.max(1, parseInt(e.target.value, 10) || 30); render(); });
  $('#pitches').addEventListener('input', (e) => { state.cfg.pitches = Math.min(12, Math.max(1, parseInt(e.target.value, 10) || 1)); render(); });
  $('#transition').addEventListener('input', (e) => { state.cfg.transition = Math.max(0, parseInt(e.target.value, 10) || 0); render(); });

  $('#planning').addEventListener('input', (e) => {
    const t = e.target;
    if (t.tagName === 'SELECT' && t.dataset.pen) {
      state.pen[t.dataset.pen] = t.value;
      render();
      return;
    }
    if (t.tagName !== 'INPUT') return;
    const id = t.dataset.id;
    state.scores[id] = state.scores[id] || { a: '', b: '' };
    state.scores[id][t.dataset.side] = t.value;
    render();
  });

  $('#btnCopy').addEventListener('click', () => {
    writeHash();
    const done = () => { $('#btnCopy').textContent = 'Lien copié ✓'; setTimeout(() => { $('#btnCopy').textContent = 'Copier le lien'; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done, () => prompt('Copiez ce lien :', location.href));
    else prompt('Copiez ce lien :', location.href);
  });
  $('#btnReset').addEventListener('click', () => {
    if (!confirm('Effacer tous les scores ?')) return;
    state.scores = {}; state.pen = {};
    render();
  });
  $('#btnShuffle').addEventListener('click', () => {
    if (Object.keys(state.scores).length && !confirm('Mélanger les équipes efface les scores. Continuer ?')) return;
    const a = state.teams.slice(0, state.n);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    state.teams = a.concat(state.teams.slice(state.n)); state.scores = {}; state.pen = {};
    renderTeams();
    render();
  });

  renderTeams();
  render();
})();
</script>
</body>
</html>
